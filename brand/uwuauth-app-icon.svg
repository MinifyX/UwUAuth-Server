<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="UwUAuth app icon: Nyu as an ID badge with cat ears">
  <title>UwUAuth</title>
  <!--
    The website and GitHub icon, built like UwUMail's and UwULock's: Nyu
    slightly tilted on the pastel pink tile (#FFF3F8 to #FFD3E5, the same for
    every UwU app), with sparkles and a heart arranged differently for each
    app. The clip between the ears and the golden seal say identity.
    Here: the big star top right, a small star left, the heart bottom right.
  -->
  <defs>
    <linearGradient id="uwu-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3F8"/>
      <stop offset="1" stop-color="#FFD3E5"/>
    </linearGradient>
    <filter id="uwu-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#C2306F" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#uwu-bg)"/>
  <g transform="translate(252 270) rotate(-6) scale(1.5) translate(-128 -138)">
    <g filter="url(#uwu-shadow)">
      <g fill="#FFFFFF" stroke="#FFFFFF" stroke-width="18" stroke-linejoin="round" stroke-linecap="round">
        <circle cx="128" cy="34" r="12"/>
        <rect x="115" y="40" width="26" height="50" rx="8"/>
        <path d="M62 88 L80 36 L114 88 Z"/>
        <path d="M142 88 L176 36 L194 88 Z"/>
        <rect x="34" y="74" width="188" height="164" rx="24"/>
      </g>
      <circle cx="128" cy="34" r="12" fill="none" stroke="#4B1D3F" stroke-width="7"/>
      <rect x="115" y="40" width="26" height="50" rx="8" fill="#C9B6F0" stroke="#4B1D3F" stroke-width="8" stroke-linejoin="round"/>
      <g stroke="#4B1D3F" stroke-width="9" stroke-linejoin="round">
        <path d="M62 88 L80 36 L114 88 Z" fill="#FF6FA6"/>
        <path d="M142 88 L176 36 L194 88 Z" fill="#FF6FA6"/>
      </g>
      <path d="M76 82 L84 52 L100 82 Z" fill="#FFB8D3"/>
      <path d="M156 82 L172 52 L180 82 Z" fill="#FFB8D3"/>
      <rect x="34" y="74" width="188" height="164" rx="24" fill="#FF6FA6" stroke="#4B1D3F" stroke-width="9"/>
      <rect x="110" y="84" width="36" height="9" rx="4.5" fill="#4B1D3F"/>
      <rect x="50" y="102" width="156" height="86" rx="16" fill="#2A2458" stroke="#4B1D3F" stroke-width="7"/>
      <g fill="#FF4D8D" opacity="0.75">
        <ellipse cx="78" cy="154" rx="11" ry="6.5"/>
        <ellipse cx="178" cy="154" rx="11" ry="6.5"/>
      </g>
      <g fill="none" stroke="#FFB8D3" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M90 126 v3 a10 10 0 0 0 20 0 v-3"/>
        <path d="M146 126 v3 a10 10 0 0 0 20 0 v-3"/>
        <path d="M112 156 q8 11 16 0 q8 11 16 0"/>
      </g>
      <rect x="54" y="200" width="104" height="11" rx="5.5" fill="#4B1D3F"/>
      <rect x="54" y="218" width="68" height="8" rx="4" fill="#FFB8D3"/>
      <circle cx="190" cy="212" r="15" fill="#FFD66E" stroke="#4B1D3F" stroke-width="6"/>
      <path d="M183 212 L188.5 217.5 L198 207" fill="none" stroke="#4B1D3F" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <g stroke="#4B1D3F" stroke-linejoin="round">
    <path transform="translate(440 440) translate(-434 -437)" d="M434 462 C410 446 403 433 406 423 C409 412 423 409 430 418 L434 424 L438 418 C445 409 459 412 462 423 C465 433 458 446 434 462Z" fill="#FF6FA6" stroke-width="8"/>
    <path d="M60 236 Q62.8 253.2 80 256 Q62.8 258.8 60 276 Q57.2 258.8 40 256 Q57.2 253.2 60 236Z" fill="#FFD66E" stroke-width="6"/>
    <path d="M430 44 Q435 75 466 80 Q435 85 430 116 Q425 85 394 80 Q425 75 430 44Z" fill="#FFD66E" stroke-width="8"/>
  </g>
</svg>
