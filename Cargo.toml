[workspace]
resolver = "3"
members = [
    "crates/uwuauth-store",
    "crates/uwuauth-mail",
    "crates/uwuauth-web",
    "crates/uwuauth-api",
    "crates/uwuauth-ldap",
    "crates/uwuauth-server",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/MinifyX/UwUAuth-Server"
rust-version = "1.89"

[workspace.dependencies]
uwuauth-api = { path = "crates/uwuauth-api" }
uwuauth-ldap = { path = "crates/uwuauth-ldap" }
uwuauth-mail = { path = "crates/uwuauth-mail" }
uwuauth-server = { path = "crates/uwuauth-server" }
uwuauth-store = { path = "crates/uwuauth-store" }
uwuauth-web = { path = "crates/uwuauth-web" }

# Passwords and app passwords: Argon2id.
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash", "std"] }
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "tokio", "query", "form"] }
# TLS with the server's own certificate files or one from Let's Encrypt; the provider is chosen below.
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
base64 = "0.22"
# WebAuthn: what authenticators send is CBOR.
ciborium = "0.2"
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# Timeouts for reading a request's head, below axum-server.
hyper-util = { version = "0.1", features = ["tokio"] }
# Time windows for kids' accounts are local times: the time zone database comes with the binary,
# so the distroless image needs none.
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-bundle-always"] }
# Mail over SMTP, TLS by rustls with `ring` like everything else here.
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "pool", "smtp-transport", "tokio1-rustls-tls"] }
# LDAP's messages (BER) and filters, from Kanidm.
ldap3_proto = "0.8"
libc = "0.2"
parking_lot = "0.12"
# Health check and update check: rustls with `ring`, set up by hand, so nothing pulls in a second
# crypto library.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "http2"] }
# Signing tokens, sealing secrets, hashing, random numbers and TOTP: the crypto rustls brings
# along anyway.
ring = "0.17"
# Only to make the RSA key for RS256 once: `ring` signs with it, but cannot make one. Every
# signature is `ring`'s, so the `rsa` crate's timing issue with private-key operations
# (RUSTSEC-2023-0071) never meets anything an attacker can time.
rsa = { version = "0.9", default-features = false, features = ["std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
# Bundled SQLite, so the server never depends on whichever libsqlite3 is around.
rusqlite = { version = "0.40", features = ["bundled"] }
# `ring` rather than aws-lc: it needs no C toolchain beyond a compiler, which keeps the arm64
# cross build simple.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Certificates from Let's Encrypt over TLS-ALPN-01: port 443 is all it needs, no port 80.
rustls-acme = { version = "0.15", default-features = false, features = ["ring", "tls12", "webpki-roots", "axum"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net", "fs"] }
tokio-stream = "0.1"
# LDAPS and StartTLS: rustls with `ring`, like the rest.
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
tokio-util = { version = "0.7", features = ["codec"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["compression-br", "compression-gzip", "set-header", "limit", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Redirect addresses of apps, taken apart and put together with the answer.
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
webpki-roots = "1"

# Tests only.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
tempfile = "3"

# Debug info is kept to line tables, and none for dependencies, which makes the target directory
# a fraction of its size and linking fast. `ring` is built optimised even in a debug build: the
# tests do TLS handshakes, and later hash passwords.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.package.ring]
opt-level = 3

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# Making an RSA key takes a while unoptimised; the server does it once, tests with a fixed key.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3

[profile.release]
codegen-units = 1
# No `panic = "abort"`: a bug in one request should fail that request, not the whole server.
lto = "thin"
opt-level = 3
strip = true
